<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVN日志: {{TARGET_NAME}}</title>
    <link rel="stylesheet" href="{{STYLE_URI}}">
</head>
<body>
    <!-- 本地版本信息 -->
    <div class="local-revision-info" id="localRevisionInfo" style="display: none;">
        <div>
            <span class="local-revision-label">本地修订版本:</span>
            <span id="localRevisionNumber">--</span>
        </div>
        <div>
            <span>橙色边框表示该版本尚未更新到本地</span>
        </div>
    </div>
    
    <!-- 日志筛选表单 -->
    <div class="filter-form">
        <div class="filter-mode-toggle">
            <label class="filter-label">
                <input type="checkbox" id="dateFilterToggle" class="filter-checkbox">
                <span>使用日期筛选</span>
            </label>
        </div>
        
        <!-- 修订版本筛选区域 -->
        <div id="revisionFilterSection">
            <div class="filter-group">
                <span class="filter-label">修订版本:</span>
                <input type="text" id="revisionFilter" class="filter-input" placeholder="如: 100 或 100:200">
            </div>
        </div>
        
        <!-- 日期筛选区域 -->
        <div id="dateFilterSection" style="display: none;">
            <div class="filter-group">
                <span class="filter-label">起始日期:</span>
                <input type="date" id="startDateFilter" class="filter-input">
            </div>
            <div class="filter-group">
                <span class="filter-label">结束日期:</span>
                <input type="date" id="endDateFilter" class="filter-input">
            </div>
        </div>
        
        <div class="filter-group log-text-filter-group">
            <input type="text" id="logFilterInput" class="filter-input log-text-filter" placeholder="过滤：输入作者、日志关键词、版本号…（空格 AND，+ OR）">
        </div>
        <button id="filterButton" class="filter-button">筛选版本/日期</button>
        <button id="clearFilterButton" class="filter-button filter-clear">清除</button>
        <div class="filter-result" id="filterResult"></div>
    </div>
    
    <div class="container">
        <div class="log-list-pane">
            <div class="log-list-columns">
                <span class="log-select-column"><input type="checkbox" id="selectAllLogs" title="全选/取消全选当前显示日志"></span>
                <span>版本</span>
                <div class="col-meta"><span>作者</span><span>日期</span></div>
            </div>
            <div class="log-list" id="logList">
                <!-- 日志列表头部信息 -->
                <div class="log-list-header" id="logListHeader" style="display: none; padding: 10px; border-bottom: 1px solid var(--vscode-panel-border); background-color: var(--vscode-editor-background);">
                    <div class="log-count-summary" id="logCountSummary" style="font-weight: bold; color: var(--vscode-foreground);"></div>
                    <div class="log-filter-status" id="logFilterStatus" style="font-size: 0.9em; color: var(--vscode-descriptionForeground); margin-top: 3px;"></div>
                </div>

                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div>加载中，请稍候...</div>
                </div>
            </div>
        </div>
        <div class="log-details" id="logDetails">
            <div class="empty-state">
                <div class="empty-icon">📝</div>
                <div>请选择一个日志条目查看详情</div>
            </div>
        </div>
    </div>

    <div id="mergeOutputSection" class="merge-output-section" style="display: none;">
        <div class="merge-output-header">合并输出</div>
        <div id="mergeOutput" class="merge-output"></div>
    </div>

    <div class="log-footer">
        <div class="log-footer-info">
            <span class="log-footer-navigation">
                <button id="refreshButton">刷新</button>
                <span id="loadMoreControl" style="display:none;"><button id="loadMoreButton">加载更多</button></span>
            </span>
            <span id="logCountInfo" class="log-count-info"></span>
        </div>
        <div class="log-footer-actions">
            <button id="changeMergeTargetButton" class="secondary-button" style="display:none;" title="切换要合并到的分支目录">切换目录</button>
            <button id="mergeToBranchButton" class="two-line-button" style="display:none;" title="将选中的日志版本合并到所选分支目录并自动提交">
                <span class="btn-line1">合并到分支...</span>
                <span class="btn-line2"></span>
            </button>
            <button id="resolveMergeConflictsButton" style="display:none;" title="打开冲突解决面板">解决冲突</button>
            <button id="commitMergeButton" style="display:none;" title="冲突解决后提交合并结果">提交合并</button>
            <button id="retryCommitMergeButton" style="display:none;" title="按原提交信息再次提交合并结果">再次提交</button>
            <button id="generatePatchButton" style="display:none;" title="根据选中的日志版本生成 Lua patch">生成 patch</button>
            <button id="cancelMergeButton" style="display:none;">取消</button>
            <button id="closeLogPanelButton">关闭</button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner" aria-label="加载中"></div>
    </div>
    
    <script src="{{SCRIPT_URI}}"></script>
</body>
</html>
